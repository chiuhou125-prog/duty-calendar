<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>偵二隊行動排班系統</title>
    
    <!-- 🌟 新增：在畫面渲染前瞬間讀取使用者的主題記憶，避免閃爍 -->
    <script>
        let savedTheme = localStorage.getItem('duty_app_theme') || 'default';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* 🌟 預設主題：經典暗黑 (特勤風) */
        :root, [data-theme="default"] {
            --bg-main: #121212;
            --text-main: #E0E0E0;
            --btn-bg: #252526;
            --btn-txt: #E0E0E0;
            --primary-bg: #007ACC;
            --primary-txt: white;
            --grid-bg: #333333;
            --day-header-bg: #1E1E1E;
            --cell-bg: #252526;
            --cell-empty: #121212;
            --duty-bg: #1A3B32;
            --duty-txt: #4ADE80;
            --off-bg: #451A1F;
            --off-txt: #FCA5A5;
            --panel-bg: #1E1E1E;
            --input-bg: #121212;
            --input-border: #333;
            --input-txt: #E4E4E7;
            --glow-1: #007ACC;
            --glow-2: #60A5FA;
            --text-reserve: #93C5FD;
            --text-case: #FFD700;
            --text-note: #FCA5A5;
        }

        /* ☕ 主題 2：無印文青 */
        [data-theme="minimal"] {
            --bg-main: #F9F9F6;
            --text-main: #4A4A4A;
            --btn-bg: #EAEAEA;
            --btn-txt: #5C5C5C;
            --primary-bg: #8B7355;
            --primary-txt: white;
            --grid-bg: #DDDDDD;
            --day-header-bg: #EAEAEA;
            --cell-bg: #FFFFFF;
            --cell-empty: #F9F9F6;
            --duty-bg: #E8F0E8;
            --duty-txt: #4A7A4A;
            --off-bg: #F9EBEB;
            --off-txt: #A85A5A;
            --panel-bg: #FFFFFF;
            --input-bg: #F9F9F6;
            --input-border: #CCC;
            --input-txt: #333;
            --glow-1: #8B7355;
            --glow-2: #CDBA96;
            --text-reserve: #5B8FB9;
            --text-case: #D97706;
            --text-note: #E11D48;
        }

        /* 🏕️ 主題 3：自然原木 */
        [data-theme="nature"] {
            --bg-main: #EFECE6;
            --text-main: #4A4036;
            --btn-bg: #DCD3C6;
            --btn-txt: #4A4036;
            --primary-bg: #5B7052;
            --primary-txt: white;
            --grid-bg: #C1B4A4;
            --day-header-bg: #DCD3C6;
            --cell-bg: #F9F8F6;
            --cell-empty: #EFECE6;
            --duty-bg: #D5E0D1;
            --duty-txt: #384A30;
            --off-bg: #EEDDDB;
            --off-txt: #8A4F4A;
            --panel-bg: #F9F8F6;
            --input-bg: #FFFFFF;
            --input-border: #C1B4A4;
            --input-txt: #4A4036;
            --glow-1: #5B7052;
            --glow-2: #849E79;
            --text-reserve: #39638A;
            --text-case: #B07D1E;
            --text-note: #A43F3F;
        }

        /* 🌊 主題 4：休閒海洋 */
        [data-theme="ocean"] {
            --bg-main: #E3F2FD;
            --text-main: #1565C0;
            --btn-bg: #BBDEFB;
            --btn-txt: #0D47A1;
            --primary-bg: #0288D1;
            --primary-txt: white;
            --grid-bg: #90CAF9;
            --day-header-bg: #BBDEFB;
            --cell-bg: #FFFFFF;
            --cell-empty: #E3F2FD;
            --duty-bg: #E0F2F1;
            --duty-txt: #00695C;
            --off-bg: #FFEBEE;
            --off-txt: #C62828;
            --panel-bg: #FFFFFF;
            --input-bg: #F5FAFF;
            --input-border: #90CAF9;
            --input-txt: #1565C0;
            --glow-1: #0288D1;
            --glow-2: #4FC3F7;
            --text-reserve: #0277BD;
            --text-case: #E65100;
            --text-note: #AD1457;
        }

        /* 🚀 主題 5：科技霓虹 */
        [data-theme="cyber"] {
            --bg-main: #0B0C10;
            --text-main: #66FCF1;
            --btn-bg: #1F2833;
            --btn-txt: #45A29E;
            --primary-bg: #45A29E;
            --primary-txt: #0B0C10;
            --grid-bg: #1F2833;
            --day-header-bg: #0B0C10;
            --cell-bg: #111111;
            --cell-empty: #000000;
            --duty-bg: #1A0B2E;
            --duty-txt: #D400FF;
            --off-bg: #3A0012;
            --off-txt: #FF003C;
            --panel-bg: #111111;
            --input-bg: #0B0C10;
            --input-border: #66FCF1;
            --input-txt: #66FCF1;
            --glow-1: #66FCF1;
            --glow-2: #D400FF;
            --text-reserve: #00FFFF;
            --text-case: #FFFF00;
            --text-note: #FF00FF;
        }

        body { background-color: var(--bg-main); color: var(--text-main); font-family: '微軟正黑體', sans-serif; margin: 0; padding: 10px; padding-bottom: 50px; transition: all 0.3s ease; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .nav-title { font-size: 20px; font-weight: bold; }
        .nav-controls { display: flex; align-items: center; gap: 10px; }
        
        button, select { background-color: var(--btn-bg); color: var(--btn-txt); border: none; padding: 8px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; outline: none; }
        select { border: 1px solid var(--grid-bg); }
        button.primary { background-color: var(--primary-bg); color: var(--primary-txt); width: 100%; padding: 15px; font-size: 16px; margin-top: 10px; }
        
        .legend { font-size: 12px; opacity: 0.8; margin-bottom: 10px; line-height: 1.4; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background-color: var(--grid-bg); border: 2px solid var(--grid-bg); border-radius: 8px; overflow: hidden; touch-action: pan-y; }
        .day-header { background-color: var(--day-header-bg); text-align: center; padding: 8px 0; font-size: 13px; font-weight: bold; }
        .cal-cell { background-color: var(--cell-bg); min-height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px; text-align: center; cursor: pointer; transition: background-color 0.3s; }
        .cal-cell.empty { background-color: var(--cell-empty); cursor: default; }
        .cell-duty { background-color: var(--duty-bg); color: var(--duty-txt); }
        .cell-off { background-color: var(--off-bg); color: var(--off-txt); }
        
        .date-num { font-size: 15px; font-weight: bold; margin-bottom: 2px; }
        .info-txt { font-size: 11px; margin: 1px 0; }
        .reserve-txt { color: var(--text-reserve); font-size: 11px; }
        .task-case { color: var(--text-case); font-size: 11px; font-weight: bold; margin-top: 2px; }
        .task-note { color: var(--text-note); font-size: 11px; font-weight: bold; margin-top: 2px; }
        
        .edit-panel { background-color: var(--panel-bg); padding: 15px; border-radius: 8px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .selected-date-title { font-size: 18px; color: var(--primary-bg); font-weight: bold; margin-bottom: 15px; }
        
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-weight: bold; margin: 10px 0 5px; font-size: 14px; }
        .input-group select, .input-group input[type="text"], .input-group textarea { 
            width: 100%; box-sizing: border-box; background-color: var(--input-bg); color: var(--input-txt); 
            border: 1px solid var(--input-border); border-radius: 6px; padding: 10px; font-family: inherit; font-size: 14px; 
        }
        .input-group textarea { resize: vertical; }
        .label-case { color: var(--text-case); }
        .label-note { color: var(--text-note); }
        
        #login-screen, #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-main); z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
        }
        #loading-screen { z-index: 10000; }
        #login-screen input { 
            width: 100%; max-width: 300px; padding: 15px; font-size: 16px; 
            text-align: center; border-radius: 8px; border: 1px solid var(--grid-bg); margin-bottom: 15px;
            background-color: var(--cell-bg); color: var(--text-main);
        }

        @keyframes pulseGlow {
            0% { box-shadow: inset 0 0 0 2px var(--glow-1), inset 0 0 5px rgba(0,0,0,0.1); }
            50% { box-shadow: inset 0 0 0 2px var(--glow-2), inset 0 0 15px var(--glow-2); }
            100% { box-shadow: inset 0 0 0 2px var(--glow-1), inset 0 0 5px rgba(0,0,0,0.1); }
        }
        .today-glow { animation: pulseGlow 2s infinite ease-in-out; position: relative; z-index: 2; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h3 style="color:var(--primary-bg);">系統載入中...</h3>
    </div>

    <div id="login-screen" style="display: none;">
        <h2 style="color:var(--primary-bg); margin-bottom: 5px;">🛡️ 偵二隊排班系統</h2>
        <p style="opacity: 0.7; margin-bottom: 30px; font-size: 14px;">請輸入辦公室專屬帳號與密碼</p>
        <input type="text" id="acc-input" placeholder="帳號 (例如: zhen2)" autocapitalize="off">
        <input type="password" id="pwd-input" placeholder="密碼">
        <button class="primary" style="max-width: 300px;" onclick="verifyLogin()">解鎖進入</button>
    </div>

    <div id="app-content" style="display: none;">
        <div class="nav-bar">
            <div class="nav-title" id="month-label"></div>
            <div class="nav-controls">
                <button onclick="changeMonth(-1)">◀</button>
                <button onclick="changeMonth(1)">▶</button>
            </div>
        </div>
        
        <!-- 🌟 新增：工具列加入主題選擇器 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; gap: 8px;">
                <button onclick="loadTasks(true)">🔄 同步</button>
                <select id="theme-selector" onchange="changeTheme()">
                    <option value="default">🚓 經典暗黑</option>
                    <option value="minimal">☕ 無印文青</option>
                    <option value="nature">🏕️ 自然原木</option>
                    <option value="ocean">🌊 休閒海洋</option>
                    <option value="cyber">🚀 科技霓虹</option>
                </select>
            </div>
            <label style="font-size: 14px; display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" id="show-chk" onchange="renderCalendar()"> 顯示其他外勤隊
            </label>
        </div>

        <div class="legend">💡 [⭐案件] 重要勤務 │ [📌記事] 備註 │ (預備) 偵六隊值班</div>
        
        <div class="calendar-grid" id="calendar"></div>

        <div class="edit-panel" id="edit-panel" style="display: none;">
            <div class="selected-date-title" id="sel-date-lbl">請選擇日期</div>
            
            <div style="background-color: var(--cell-bg); padding: 10px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid var(--primary-bg);">
                <div class="input-group">
                    <label style="color:var(--text-reserve); margin-top:0;">🔄 手動調整：</label>
                    <select id="override-duty">
                        <option value="">(依照系統預設排班)</option>
                        <option value="off">強制標示為「休假」</option>
                        <option value="work">強制標示為「上班」</option>
                    </select>
                </div>
                <div class="input-group">
                    <label style="color:var(--text-main); opacity:0.8;">🏷️ 自訂假別或節日名稱：</label>
                    <input type="text" id="custom-reason" placeholder="例如：輪休、專案補休、聚餐...">
                </div>
            </div>

            <div class="input-group"><label class="label-case">⭐ 執行案件 (重要)：</label><textarea id="case-text" rows="3"></textarea></div>
            <div class="input-group"><label class="label-note">📌 一般記事：</label><textarea id="note-text" rows="3"></textarea></div>
            <button class="primary" onclick="saveTask()">💾 儲存</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://calandar-2e41c-default-rtdb.asia-southeast1.firebasedatabase.app/tasks";
        
        // 🔑 記得將下方替換為您的 API_KEY
        const API_KEY = "AIzaSyAJdTuKBRpj2So4QPyCllHc0ucva4qx5g8"; 
        
        let ID_TOKEN = ""; 
        let REFRESH_TOKEN = localStorage.getItem("duty_app_refresh") || "";

        let currentDate = new Date();
        let selectedDateStr = "";
        let tasks = {};

        let touchStartX = 0; let touchEndX = 0; let touchStartY = 0; let touchEndY = 0;

        window.onload = async function() {
            // 初始化主題選單的顯示
            document.getElementById('theme-selector').value = savedTheme;
            
            if (REFRESH_TOKEN) {
                let success = await refreshIdToken();
                if (success) {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                    setupSwipeListeners(); 
                    return;
                }
            }
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        };

        // 🌟 新增：切換主題並記憶的功能
        function changeTheme() {
            let selected = document.getElementById('theme-selector').value;
            document.documentElement.setAttribute('data-theme', selected);
            localStorage.setItem('duty_app_theme', selected);
        }

        function setupSwipeListeners() {
            const calendarEl = document.getElementById('calendar');
            calendarEl.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY;
            }, {passive: true});
            calendarEl.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX; touchEndY = e.changedTouches[0].screenY;
                handleSwipeGesture();
            }, {passive: true});
        }

        function handleSwipeGesture() {
            const deltaX = touchEndX - touchStartX; const deltaY = touchEndY - touchStartY;
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
                if (deltaX < 0) changeMonth(1);
                else if (deltaX > 0) changeMonth(-1);
            }
        }

        async function refreshIdToken() {
            let refreshUrl = `https://securetoken.googleapis.com/v1/token?key=${API_KEY}`;
            try {
                let res = await fetch(refreshUrl, {
                    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `grant_type=refresh_token&refresh_token=${REFRESH_TOKEN}`
                });
                let data = await res.json();
                if (data.id_token) {
                    ID_TOKEN = data.id_token; REFRESH_TOKEN = data.refresh_token;
                    localStorage.setItem("duty_app_refresh", REFRESH_TOKEN);
                    await loadTasks(false);
                    return true;
                }
            } catch (e) {}
            localStorage.removeItem("duty_app_refresh");
            return false;
        }

        async function verifyLogin() {
            let acc = document.getElementById('acc-input').value.trim();
            let pwd = document.getElementById('pwd-input').value;
            if(!acc || !pwd) return alert("請輸入帳號與密碼！");
            
            let formattedEmail = acc.includes('@') ? acc : acc + "@ntpd.gov.tw";
            let authUrl = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`;
            let btn = document.querySelector("#login-screen button");
            btn.innerText = "驗證中...";
            
            try {
                let res = await fetch(authUrl, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: formattedEmail, password: pwd, returnSecureToken: true })
                });
                let data = await res.json();
                
                if (data.idToken && data.refreshToken) {
                    ID_TOKEN = data.idToken; REFRESH_TOKEN = data.refreshToken;
                    localStorage.setItem("duty_app_refresh", REFRESH_TOKEN);
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                    setupSwipeListeners(); 
                    loadTasks(true); 
                } else {
                    btn.innerText = "解鎖進入";
                    document.getElementById('pwd-input').value = "";
                    alert("帳號或密碼錯誤，請重新輸入。");
                }
            } catch (e) {
                btn.innerText = "解鎖進入"; alert("連線失敗，請檢查網路狀態。");
            }
        }

        const DYNAMIC_HOLIDAYS = {
            "2026-02-16": "除夕", "2026-02-17": "初一", "2026-02-18": "初二", 
            "2026-02-19": "初三", "2026-02-20": "初四", "2026-02-21": "初五", 
            "2026-03-02": "和平紀念日補假", 
            "2026-04-03": "兒童節補假", "2026-04-04": "清明節", "2026-04-06": "清明節補假", 
            "2026-06-19": "端午節", "2026-09-25": "中秋節", "2026-10-09": "國慶日補假",
            "2027-02-05": "除夕", "2027-02-06": "初一", "2027-02-07": "初二", 
            "2027-02-08": "初三", "2027-02-09": "初四", "2027-02-10": "初五",
            "2027-04-05": "清明節", "2027-06-09": "端午節", "2027-09-15": "中秋節",
            "2028-01-25": "除夕", "2028-01-26": "初一", "2028-01-27": "初二", 
            "2028-01-28": "初三", "2028-01-29": "初四", "2028-01-30": "初五",
            "2028-04-04": "清明節", "2028-05-28": "端午節", "2028-10-03": "中秋節"
        };
        const FIXED_HOLIDAYS = { 
            "1-1": "元旦", "2-28": "和平紀念日", "4-4": "兒童節", 
            "5-1": "勞動節", "6-15": "警察節", "9-28": "教師節", "10-10": "國慶日" 
        };

        function getHolidayName(dt) {
            let md = (dt.getMonth() + 1) + "-" + dt.getDate();
            if (FIXED_HOLIDAYS[md]) return FIXED_HOLIDAYS[md];
            let ymd = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, '0') + "-" + String(dt.getDate()).padStart(2, '0');
            if (DYNAMIC_HOLIDAYS[ymd]) return DYNAMIC_HOLIDAYS[ymd];
            return "";
        }

        function getDailyDuty(targetDate) {
            let baseDate = new Date(2026, 7, 1); 
            let checkDate = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
            if (checkDate < baseDate) return { squad: "未知", bCycle: "" };

            let squadsAug = ['偵二隊', '偵三隊', '偵四隊', '偵五隊', '偵六隊', '偵七隊', '偵八隊', '偵一隊'];
            let squadsSept = ['偵二隊', '偵三隊', '偵四隊', '偵五隊', '偵六隊', '偵七隊', '偵八隊', '科偵隊', '偵一隊'];

            let curr = new Date(baseDate); let squad = '偵三隊'; let zCount = 0;

            while (curr < checkDate) {
                if (squad === '偵二隊') zCount++;
                curr.setDate(curr.getDate() + 1);
                let seq = (curr.getFullYear() > 2026 || (curr.getFullYear() === 2026 && curr.getMonth() >= 8)) ? squadsSept : squadsAug;
                let idx = seq.indexOf(squad);
                squad = idx !== -1 ? seq[(idx + 1) % seq.length] : seq[0];
            }

            if (squad === '偵二隊') return { squad: squad, bCycle: (zCount % 2 === 0) ? "B1日/B2夜" : "B2日/B1夜" };
            return { squad: squad, bCycle: "" };
        }

        function isUserOff(targetDate) {
            let duty = getDailyDuty(targetDate);
            let wd = targetDate.getDay(); 
            if (duty.squad === '偵二隊') return { off: false, reason: "" };
            
            let hol = getHolidayName(targetDate);
            if (hol) return { off: true, reason: hol };

            if (wd === 0 || wd === 6) return { off: true, reason: "休假" };
            let checkOffset = (offset) => {
                let d = new Date(targetDate); d.setDate(d.getDate() + offset);
                return getDailyDuty(d).squad === '偵二隊';
            }
            if (wd === 5 && checkOffset(2)) return { off: true, reason: "補休" };
            if (wd === 1 && checkOffset(-2)) return { off: true, reason: "補休" };
            
            return { off: false, reason: "" };
        }

        async function loadTasks(showAlert = false) {
            try {
                let res = await fetch(`${FIREBASE_URL}.json?auth=${ID_TOKEN}`);
                if (!res.ok) throw new Error("Token Invalid");
                let data = await res.json();
                tasks = data || {};
                renderCalendar();
                
                if(selectedDateStr) {
                    selectDate(selectedDateStr, ...lastSelectedInfo);
                } else {
                    let realToday = new Date();
                    let todayStr = realToday.getFullYear() + "-" + String(realToday.getMonth() + 1).padStart(2, '0') + "-" + String(realToday.getDate()).padStart(2, '0');
                    let duty = getDailyDuty(realToday);
                    let offInfo = isUserOff(realToday);
                    selectDate(todayStr, duty.squad, duty.bCycle, offInfo.off, offInfo.reason);
                }
                return true;
            } catch (e) {
                if (showAlert) alert("讀取資料失敗，請確認網路連線。");
                return false;
            }
        }

        async function saveTask() {
            if (!selectedDateStr) return alert("請先選擇日期");
            let cTxt = document.getElementById('case-text').value.trim();
            let nTxt = document.getElementById('note-text').value.trim();
            let oDuty = document.getElementById('override-duty').value;
            let cReason = document.getElementById('custom-reason').value.trim();
            let tUrl = `${FIREBASE_URL}/${selectedDateStr}.json?auth=${ID_TOKEN}`;
            
            try {
                let res;
                if (cTxt || nTxt || oDuty || cReason) {
                    let payload = { case: cTxt, note: nTxt, overrideDuty: oDuty, customReason: cReason };
                    tasks[selectedDateStr] = payload;
                    res = await fetch(tUrl, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                } else {
                    delete tasks[selectedDateStr];
                    res = await fetch(tUrl, { method: 'DELETE' });
                }
                if (!res.ok) throw new Error("Token Invalid");
                renderCalendar();
                alert("☁️ 已同步至雲端！");
            } catch (e) {
                alert("儲存失敗，系統可能需要重新驗證身分，請重新整理頁面。");
            }
        }

        function changeMonth(offset) {
            currentDate.setMonth(currentDate.getMonth() + offset);
            renderCalendar();
        }

        let lastSelectedInfo = [];

        function selectDate(dateStr, squad, bCycle, isOff, reason) {
            selectedDateStr = dateStr; lastSelectedInfo = [squad, bCycle, isOff, reason];
            document.getElementById('edit-panel').style.display = "block";
            let offTxt = isOff ? ` (${reason})` : "";
            let dTxt = "";
            if (squad === '偵二隊') dTxt = ` (值班 - ${bCycle})`;
            else if (squad === '偵六隊') dTxt = " (本隊預備)";
            
            document.getElementById('sel-date-lbl').innerText = `📅 ${dateStr} | ${squad}${offTxt}${dTxt}`;
            
            let t = tasks[dateStr]; let tObj = {};
            if (t) { if (typeof t === 'string') tObj = { case: t }; else tObj = t; }
            
            document.getElementById('case-text').value = tObj.case || "";
            document.getElementById('note-text').value = tObj.note || "";
            document.getElementById('override-duty').value = tObj.overrideDuty || "";
            document.getElementById('custom-reason').value = tObj.customReason || "";
            
            setTimeout(() => { document.getElementById('edit-panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100); 
        }

        function renderCalendar() {
            let y = currentDate.getFullYear(); let m = currentDate.getMonth();
            document.getElementById('month-label').innerText = `${y} 年 ${m + 1} 月`;
            
            let calDiv = document.getElementById('calendar'); calDiv.innerHTML = "";
            let days = ["一", "二", "三", "四", "五", "六", "日"];
            days.forEach(d => { calDiv.innerHTML += `<div class="day-header">${d}</div>`; });
            
            let firstDay = new Date(y, m, 1); let lastDay = new Date(y, m + 1, 0);
            let startWd = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1; 
            
            for (let i = 0; i < startWd; i++) calDiv.innerHTML += `<div class="cal-cell empty"></div>`;
            
            let showOthers = document.getElementById('show-chk').checked; let realToday = new Date();

            for (let d = 1; d <= lastDay.getDate(); d++) {
                let dt = new Date(y, m, d);
                let dStr = y + "-" + String(m+1).padStart(2,'0') + "-" + String(d).padStart(2,'0');
                
                let duty = getDailyDuty(dt); let offInfo = isUserOff(dt); let hName = getHolidayName(dt);
                let squad = duty.squad; let isOff = offInfo.off; let reason = offInfo.reason;
                
                let task = tasks[dStr]; let tObj = {};
                if (task) { if (typeof task === 'string') tObj = { case: task }; else tObj = task; }

                if (tObj.overrideDuty === 'off') isOff = true;
                else if (tObj.overrideDuty === 'work') isOff = false;

                let displayReason = tObj.customReason ? tObj.customReason : (reason || hName);
                
                let cls = "cal-cell";
                if (isOff) cls += " cell-off";
                else if (squad === '偵二隊') cls += " cell-duty";
                
                if (dt.getFullYear() === realToday.getFullYear() && dt.getMonth() === realToday.getMonth() && dt.getDate() === realToday.getDate()) {
                    cls += " today-glow";
                }
                
                let showSquad = squad;
                if (!showOthers && squad !== '偵二隊' && squad !== '偵六隊') showSquad = "";

                let html = `<div class="date-num">${d}</div>`;
                
                if (squad === '偵二隊') {
                    if (showSquad) html += `<div class="info-txt">${showSquad}</div>`;
                    if (!isOff) html += `<div class="info-txt">${duty.bCycle}</div>`;
                    if (displayReason) {
                        if (isOff) html += `<div class="info-txt">(${displayReason})</div>`;
                        else html += `<div class="info-txt">[${displayReason}]</div>`;
                    }
                } else if (squad === '偵六隊') {
                    html += `<div class="reserve-txt">${showSquad ? '偵六隊(預備)' : '(預備)'}</div>`;
                    if (isOff && displayReason) html += `<div class="info-txt">(${displayReason})</div>`;
                    else if (!isOff && tObj.customReason) html += `<div class="info-txt">[${tObj.customReason}]</div>`;
                } else {
                    if (showSquad) html += `<div class="info-txt">${showSquad}</div>`;
                    if (isOff && displayReason) html += `<div class="info-txt">(${displayReason})</div>`;
                    else if (!isOff && tObj.customReason) html += `<div class="info-txt">[${tObj.customReason}]</div>`;
                }
                
                if (tObj.case && tObj.case.trim()) html += `<div class="task-case">⭐案件</div>`;
                if (tObj.note && tObj.note.trim()) html += `<div class="task-note">📌記事</div>`;
                
                let cellDiv = document.createElement('div');
                cellDiv.className = cls; cellDiv.innerHTML = html;
                cellDiv.onclick = () => selectDate(dStr, squad, duty.bCycle, isOff, offInfo.reason);
                calDiv.appendChild(cellDiv);
            }
        }
    </script>
</body>
</html>
