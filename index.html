<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14161B">
<meta name="application-name" content="偵二隊行事曆">
<meta name="apple-mobile-web-app-title" content="偵二隊行事曆">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>偵二隊行事曆</title>
<script>
  // 畫面出來前先套用記住的主題，避免閃爍（舊版的「科技霓虹」改用經典暗黑）
  (function () {
    var t = localStorage.getItem("duty_app_theme") || "default";
    if (["default", "minimal", "nature", "ocean", "minecraft"].indexOf(t) < 0) t = "default";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  /* ===== 主題配色（與電腦版相同） ===== */
  :root, [data-theme="default"] {
    --bg:#14161B; --surface:#1C1F26; --surface2:#272B34; --border:#2D323C; --text:#E7E9EE; --muted:#8C94A3;
    --accent:#4C8DFF; --accent-text:#FFFFFF; --cell:#1C1F26; --cell-other:#17191E; --duty-bg:#16372A; --duty-fg:#5FE3A1;
    --off-bg:#3B1F27; --off-fg:#FF9DAA; --reserve-fg:#7DB3FF; --holiday-fg:#FFB870; --case-fg:#FFD166; --note-fg:#B8C4FF;
    --manual-fg:#FFD166; --weekend-fg:#FF8A96; --leave-fg:#6FD8E8; --shadow:rgba(0,0,0,.45);
  }
  [data-theme="minimal"] {
    --bg:#F2EFE9; --surface:#FBFAF7; --surface2:#ECE7DF; --border:#DCD5CA; --text:#38342E; --muted:#8B8478;
    --accent:#8A6A4F; --accent-text:#FFFFFF; --cell:#FDFCF9; --cell-other:#F1EDE6; --duty-bg:#E2EDE2; --duty-fg:#356B43;
    --off-bg:#F7E2DE; --off-fg:#A3443D; --reserve-fg:#3F6E95; --holiday-fg:#B0601A; --case-fg:#9C6A00; --note-fg:#5A6290;
    --manual-fg:#B0601A; --weekend-fg:#B0504A; --leave-fg:#2F7F86; --shadow:rgba(60,50,40,.25);
  }
  [data-theme="nature"] {
    --bg:#E2DCD0; --surface:#F1EDE4; --surface2:#E3DBCC; --border:#CEC4B1; --text:#3B342B; --muted:#7C7363;
    --accent:#56703F; --accent-text:#FFFFFF; --cell:#F6F2EA; --cell-other:#E8E2D6; --duty-bg:#D9E5CE; --duty-fg:#36502A;
    --off-bg:#EED8CF; --off-fg:#8E4635; --reserve-fg:#3A5E7C; --holiday-fg:#9A5F15; --case-fg:#8F6410; --note-fg:#58608A;
    --manual-fg:#9A5F15; --weekend-fg:#9A4535; --leave-fg:#2E6E70; --shadow:rgba(60,50,30,.25);
  }
  [data-theme="ocean"] {
    --bg:#E4EDF5; --surface:#F7FAFD; --surface2:#E3EBF3; --border:#CAD7E4; --text:#1B3247; --muted:#677E94;
    --accent:#2E77B8; --accent-text:#FFFFFF; --cell:#FAFCFE; --cell-other:#EDF2F7; --duty-bg:#DBF0EA; --duty-fg:#0E6B5B;
    --off-bg:#FBE4E7; --off-fg:#AE3445; --reserve-fg:#2E77B8; --holiday-fg:#BF5F08; --case-fg:#AD7314; --note-fg:#6644B8;
    --manual-fg:#BF5F08; --weekend-fg:#BE3A33; --leave-fg:#0B7F86; --shadow:rgba(20,50,80,.22);
  }
  [data-theme="minecraft"] {
    --bg:#2A2A2A; --surface:#373737; --surface2:#4A4A4A; --border:#151515; --text:#FFFFFF; --muted:#B5B5B5;
    --accent:#5CB83C; --accent-text:#FFFFFF; --cell:#6B6B6B; --cell-other:#4E4E4E; --duty-bg:#4A7F30; --duty-fg:#FFFF55;
    --off-bg:#983628; --off-fg:#FFE3DE; --reserve-fg:#7FFFFF; --holiday-fg:#FFB733; --case-fg:#FFFF55; --note-fg:#FF88FF;
    --manual-fg:#FFB733; --weekend-fg:#FF6B6B; --leave-fg:#AAFFAA; --shadow:rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-text-size-adjust: 100%;
  }
  body.lock { overflow: hidden; }
  .hidden { display: none !important; }
  button { font: inherit; }

  /* 按鈕、輸入 */
  .btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 13px; font-size: 14px; font-weight: 700; cursor: pointer; min-height: 40px; white-space: nowrap; }
  .btn:active { filter: brightness(1.15); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.danger { color: var(--off-fg); }
  .btn.ghost { background: var(--surface); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.block { width: 100%; }
  input[type=text], input[type=password], select, textarea {
    width: 100%; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 11px; font: inherit; font-size: 16px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input:disabled, select:disabled, textarea:disabled { color: var(--muted); }
  textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
  label.chk { display: flex; align-items: center; gap: 8px; font-size: 15px; padding: 6px 0; cursor: pointer; }
  label.chk input { width: 20px; height: 20px; accent-color: var(--accent); }
  .sec { font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 6px; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > .grow { flex: 1; min-width: 0; }

  /* 分段按鈕與小標籤 */
  .seg { display: flex; background: var(--surface2); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); font-size: 15px; font-weight: 700;
    padding: 9px 0; border-radius: 8px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .seg.off button { color: var(--muted); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .chip { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 13px; font-size: 14px; cursor: pointer; }

  /* 主畫面 */
  .app { max-width: 1000px; margin: 0 auto; padding: 12px 10px 24px; }
  .head { display: flex; align-items: center; gap: 8px; }
  .title { font-size: 22px; font-weight: 800; letter-spacing: .5px; }
  .roc { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .nav { margin-left: auto; display: flex; gap: 6px; }
  .nav .btn { padding: 8px 12px; }
  .tools { display: flex; gap: 6px; margin: 10px 0 8px; align-items: center; }
  .tools .btn { padding: 8px 11px; font-size: 13px; }
  .tools .me { max-width: 42vw; overflow: hidden; text-overflow: ellipsis; }
  .tools .btn.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); margin: 0 2px 8px; overflow-x: auto;
    white-space: nowrap; scrollbar-width: none; }
  .legend::-webkit-scrollbar { display: none; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; border: 1px solid; }
  .banner { background: var(--off-bg); color: var(--off-fg); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 8px; }

  /* 月曆：格子滿版、每件事一條彩色標籤；字級依螢幕寬度計算，保證一格至少放得下 5 個字 */
  :root { --chip-fs: clamp(9.5px, calc((100vw - 8px) / 7 / 5.25), 13px); --chip-h: calc(var(--chip-fs) * 1.62); --chip-p: 58%; }
  [data-theme="minimal"], [data-theme="nature"], [data-theme="ocean"] { --chip-p: 100%; }
  .calwrap { margin: 0 -10px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--bg); border-top: 1px solid var(--border);
    touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .wd { color: var(--muted); text-align: center; font-size: 12px; font-weight: 700; padding: 7px 0 6px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .wd.sun { color: var(--weekend-fg); }
  .wd.sat { color: var(--reserve-fg); }
  .cell { background: var(--cell); min-height: 88px; padding: 3px 1px 5px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
    min-width: 0; position: relative; border-bottom: 1px solid var(--border); -webkit-touch-callout: none; }
  .cell + .cell { box-shadow: -1px 0 0 0 color-mix(in srgb, var(--border) 55%, transparent); }
  .cell.other { background: var(--cell-other); }
  .cell.other .num, .cell.other .ev { opacity: .5; }
  .cell.off { background: var(--off-bg); }
  .cell.duty { background: var(--duty-bg); }
  .cell.sel, .cell.sel + .cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
  .cell.msel::after { content: "✓"; position: absolute; right: 2px; top: 2px; background: var(--accent); color: var(--accent-text);
    font-size: 10px; font-weight: 800; width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .top { display: flex; justify-content: center; align-items: center; height: 22px; flex: none; }
  .num { font-weight: 800; font-size: 15px; line-height: 22px; color: var(--text); min-width: 22px; text-align: center; }
  .cell.sun .num { color: var(--weekend-fg); }
  .cell.sat .num { color: var(--reserve-fg); }
  .num.today { background: var(--accent); color: var(--accent-text) !important; border-radius: 11px; padding: 0 6px; }
  .mk { position: absolute; right: 3px; top: 2px; color: var(--manual-fg); font-size: 10px; font-weight: 800; }
  .ev { --c: var(--muted); display: block; flex: none; height: var(--chip-h); line-height: var(--chip-h); font-size: var(--chip-fs);
    font-weight: 700; letter-spacing: -.2px; color: #FFFFFF; background: var(--c); background: color-mix(in srgb, var(--c) var(--chip-p), #000);
    border-radius: 3px; padding: 0 1px; white-space: nowrap; overflow: hidden; text-align: center; }
  .ev.more { background: transparent; color: var(--muted); font-weight: 600; }
  .legend .ev { display: inline-block; height: auto; line-height: 17px; font-size: 11px; padding: 0 6px; letter-spacing: 0; }
  @media (min-width: 600px) {
    :root { --chip-fs: 12.5px; }
    .calwrap { margin: 0; }
    .cal { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .cell { min-height: 116px; padding: 4px 3px 6px; }
    .num { font-size: 16px; }
    .wd { font-size: 13px; padding: 8px 0; }
  }
  .status { font-size: 12px; color: var(--muted); margin: 10px 2px 0; min-height: 16px; }

  /* 下方彈出的面板 */
  .backdrop { position: fixed; inset: 0; background: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 680px; max-height: 90vh; max-height: 90dvh;
    background: var(--surface); border-radius: 18px 18px 0 0; transform: translateY(105%); transition: transform .25s ease;
    z-index: 41; display: flex; flex-direction: column; box-shadow: 0 -10px 30px var(--shadow); }
  .sheet.show { transform: none; }
  .sheet .grab { width: 40px; height: 5px; background: var(--border); border-radius: 3px; margin: 8px auto 0; flex: none; }
  .sheet .body { overflow-y: auto; padding: 8px 16px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sheet .foot { flex: none; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border);
    display: flex; gap: 8px; align-items: center; background: var(--surface); border-radius: 0; }
  .sh-head { display: flex; align-items: flex-start; gap: 8px; }
  .sh-title { font-size: 21px; font-weight: 800; }
  .sh-sub, .sh-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .x { margin-left: auto; background: var(--surface2); border: 0; color: var(--text); width: 36px; height: 36px; border-radius: 50%;
    font-size: 18px; cursor: pointer; flex: none; }
  .card { background: var(--surface2); border-radius: 12px; padding: 10px 12px; margin-top: 12px; font-size: 13.5px; line-height: 1.55; }
  .card .res { color: var(--accent); font-weight: 700; }
  details.swap summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); margin: 16px 0 6px; list-style: none; }
  details.swap summary::-webkit-details-marker { display: none; }
  details.swap summary::before { content: "▸ "; }
  details.swap[open] summary::before { content: "▾ "; }
  details.swap summary.adj { color: var(--manual-fg); }
  .grid2 { display: grid; grid-template-columns: 76px 1fr; gap: 8px; align-items: center; font-size: 14px; }
  .leave { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; font-size: 15px; }
  .leave b { font-weight: 800; }
  .leave .t { color: var(--leave-fg); }
  .leave button { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 17px; cursor: pointer; padding: 0 4px; }
  .dirty { color: var(--accent); font-size: 12.5px; font-weight: 700; }

  /* 多選列 */
  .multibar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 30;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 6px 24px var(--shadow);
    padding: 8px 8px 8px 14px; display: flex; gap: 8px; align-items: center; width: min(560px, calc(100% - 20px)); }
  .multibar .n { font-weight: 800; flex: 1; font-size: 15px; }

  /* 對話框 */
  .modal-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--shadow); }
  .modal { background: var(--surface); border-radius: 16px; padding: 20px; width: min(440px, 100%); max-height: 88vh; overflow-y: auto;
    box-shadow: 0 10px 40px var(--shadow); }
  .modal h3 { margin: 0 0 6px; font-size: 19px; }
  .modal .msg { font-size: 15px; line-height: 1.6; white-space: pre-line; }
  .modal .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .remind-box { background: var(--duty-bg); color: var(--duty-fg); border: 1px solid var(--duty-fg); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
  .remind-box .big { font-size: 24px; font-weight: 800; }
  .toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 70; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { opacity: .95; }

  /* 登入 */
  .center-screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg); z-index: 80; }
  .login { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 26px 22px; width: min(380px, 100%); }
  .login h2 { margin: 0; font-size: 24px; }
  .login .err { color: var(--off-fg); font-size: 13.5px; min-height: 18px; margin-top: 8px; white-space: pre-line; }
</style>
</head>
<body>

<div id="loading" class="center-screen"><div style="color:var(--accent);font-size:18px;font-weight:700">系統連線中…</div></div>

<div id="login" class="center-screen hidden">
  <div class="login">
    <h2 id="login-title">偵二隊行事曆</h2>
    <div class="hint" style="margin:4px 0 14px">第一次使用請登入，之後會自動連線</div>
    <div class="sec" style="margin-top:0">帳號</div>
    <input type="text" id="acc" autocapitalize="off" autocomplete="username" spellcheck="false" placeholder="帳號（不用打 @ntpd.gov.tw）">
    <div class="sec">密碼</div>
    <input type="password" id="pwd" autocomplete="current-password" placeholder="密碼">
    <div class="err" id="login-err"></div>
    <button class="btn primary block" id="login-btn" style="margin-top:12px;padding:13px">登入</button>
    <button class="btn block hidden" id="offline-btn" style="margin-top:8px">離線開啟（唯讀）</button>
  </div>
</div>

<div id="main" class="app hidden">
  <div class="head">
    <div>
      <div class="title" id="month-title"></div>
      <div class="roc" id="roc"></div>
    </div>
    <div class="nav">
      <button class="btn ghost" id="prev" aria-label="上個月">◀</button>
      <button class="btn ghost" id="today">今天</button>
      <button class="btn ghost" id="next" aria-label="下個月">▶</button>
    </div>
  </div>
  <div class="tools">
    <button class="btn ghost" id="sync">🔄 同步</button>
    <button class="btn ghost" id="multi-btn">☑ 多選</button>
    <button class="btn ghost me" id="me-btn">👤 選擇身分</button>
    <button class="btn ghost" id="settings-btn" style="margin-left:auto">⚙</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="banner hidden" id="banner"></div>
  <div class="calwrap"><div class="cal" id="cal"></div></div>
  <div class="status" id="status"></div>
</div>

<div class="backdrop" id="backdrop"></div>

<!-- 單日編輯 -->
<div class="sheet" id="day-sheet" aria-hidden="true">
  <div class="grab"></div>
  <div class="body">
    <div class="sh-head">
      <div style="min-width:0">
        <div class="sh-title" id="d-title"></div>
        <div class="sh-sub" id="d-sub"></div>
        <div class="sh-meta" id="d-meta"></div>
      </div>
      <button class="x" data-close="day" aria-label="關閉">✕</button>
    </div>
    <div class="card"><div id="d-default"></div><div class="res" id="d-result"></div></div>

    <div class="sec">本隊這天</div>
    <div class="seg" id="d-status" data-ro></div>
    <div class="chips" id="d-chips"><span class="hint">快速：</span></div>
    <div class="sec">說明／標籤（例如：輪休、停休、專案勤務）</div>
    <input type="text" id="d-reason" data-ro>

    <details class="swap" id="d-swap">
      <summary id="d-swap-sum">換班調整</summary>
      <div class="grid2">
        <span>值班隊</span><select id="d-duty" data-ro></select>
        <span id="d-b-lbl">本隊班別</span><select id="d-b" data-ro></select>
      </div>
    </details>

    <div class="sec" style="color:var(--leave-fg)" id="d-leave-title">👤 人員請假</div>
    <div id="d-leaves"></div>
    <div class="row">
      <input type="text" class="grow" id="d-leave-name" list="roster-list" placeholder="姓名" data-ro>
      <select id="d-leave-type" style="width:92px" data-ro></select>
      <button class="btn" id="d-leave-add" data-ro>＋ 登記</button>
    </div>

    <div class="sec" style="color:var(--case-fg)">⭐ 執行案件（建議只填代號）</div>
    <textarea id="d-case" rows="2" data-ro></textarea>
    <div class="sec" style="color:var(--note-fg)">📌 一般記事</div>
    <textarea id="d-note" rows="3" data-ro></textarea>
  </div>
  <div class="foot">
    <div class="grow" style="flex:1;min-width:0"><span class="dirty" id="d-dirty"></span></div>
    <button class="btn" id="d-reset" data-ro>↺ 還原預設</button>
    <button class="btn primary" id="d-save" data-ro>💾 儲存</button>
  </div>
</div>

<!-- 多選調整 -->
<div class="sheet" id="batch-sheet" aria-hidden="true">
  <div class="grab"></div>
  <div class="body">
    <div class="sh-head">
      <div style="min-width:0"><div class="sh-title" id="b-title"></div><div class="sh-sub" id="b-sub"></div></div>
      <button class="x" data-close="batch" aria-label="關閉">✕</button>
    </div>
    <div class="sec">本隊這幾天</div>
    <div class="seg" id="b-status" data-ro></div>
    <div class="chips" id="b-chips"><span class="hint">快速：</span></div>
    <div class="sec">說明／標籤（留空＝不變更）</div>
    <input type="text" id="b-reason" data-ro>
    <div class="sec">值班隊（換班）</div>
    <select id="b-duty" data-ro></select>
    <div class="row" style="margin-top:12px">
      <button class="btn primary grow" id="b-apply" data-ro>套用</button>
      <button class="btn" id="b-reset" data-ro>↺ 還原預設</button>
    </div>

// ==========================================

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayDiff = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
const parseYmd = s => {
  const m = /^\s*(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})\s*$/.exec(s || "");
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getMonth() === +m[2] - 1 && d.getDate() === +m[3] ? d : null;
};
const nowStr = () => { const d = new Date(); return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const hhmm = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const norm = v => (typeof v === "string" ? v.trim() : "");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const firstLine = s => { s = norm(s); return s ? s.split(/\r?\n/)[0].trim() : ""; };
const fmtMD = d => `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）`;
const lsGet = (k, fallback) => { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ==========================================
// 🚓 輪值與休假規則（雲端 /dutySettings，與電腦版共用）
// ==========================================
function normalizeTeam(s) {
  s = String(s || "").trim().toUpperCase().replace(/Ｂ/g, "B").replace(/１/g, "1").replace(/２/g, "2");
  return TEAMS.includes(s) ? s : "";
}
const teamLabel = t => (TEAMS.includes(t) ? `${t} 小隊` : "隊部");
function parseMembers(raw) {
  const out = [], seen = new Set();
  for (const line of String(raw || "").split(/\r?\n/)) {
    const tokens = line.trim().split(/[\s,，、]+/).filter(Boolean);
    if (!tokens.length) continue;
    let team = "";
    const last = tokens[tokens.length - 1];
    if (tokens.length > 1 && (normalizeTeam(last) || NO_TEAM_WORDS.has(last))) team = normalizeTeam(tokens.pop());
    for (const n of tokens) if (!seen.has(n)) { seen.add(n); out.push([n, team]); }
  }
  return out;
}
const formatMembers = ms => ms.map(([n, t]) => `${n} ${t || "隊部"}`).join("\n");
function parseExtraHolidays(text) {
  const annual = {}, once = {};
  for (const raw of String(text || "").split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    let m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})\s+(.+)$/.exec(line);
    if (m) { const d = parseYmd(`${m[1]}-${m[2]}-${m[3]}`); if (d) { once[ymd(d)] = m[4].trim(); continue; } }
    m = /^(\d{1,2})[-/.](\d{1,2})\s+(.+)$/.exec(line);
    if (m) annual[`${+m[1]}-${+m[2]}`] = m[3].trim();
  }
  return { annual, once };
}
function shiftOf(b, team) {
  const m = /^(B\d)日\/(B\d)夜$/.exec(b || "");
  if (!m || !TEAMS.includes(team)) return "";
  return team === m[1] ? "日班" : team === m[2] ? "夜班" : "";
}
const listOf = v => (Array.isArray(v) ? v : v && typeof v === "object" ? Object.values(v) : []);

class Rules {
  constructor(data) {
    const d = clone(DEFAULT_RULES);
    if (data && typeof data === "object") for (const k of Object.keys(d)) if (data[k] !== undefined && data[k] !== null) d[k] = clone(data[k]);
    this.data = d;
    this.my = String(d.my_squad || "").trim() || DEFAULT_RULES.my_squad;
    this.reserve = String(d.reserve_squad || "").trim();
    let periods = Rules.parsePeriods(d.periods);
    if (!periods.length) periods = Rules.parsePeriods(DEFAULT_RULES.periods);
    this.periods = periods;
    this.holidayOff = d.holiday_off !== false; this.weekendOff = d.weekend_off !== false;
    this.compFri = d.comp_fri !== false; this.compMon = d.comp_mon !== false;
    const ex = parseExtraHolidays(d.extra_holidays); this.extraAnnual = ex.annual; this.extraOnce = ex.once;
    this.roster = parseMembers(d.members);
    this.members = this.roster.map(r => r[0]);
    this.memberTeam = new Map(this.roster);
  }
  static parsePeriods(raw) {
    const out = [];
    for (const p of listOf(raw)) {
      if (!p) continue;
      const start = parseYmd(String(p.start || ""));
      const order = listOf(p.order).map(String).filter(s => s.trim());
      if (start && order.length && new Set(order).size === order.length)
        out.push({ start, order, firstB: B_CYCLES.includes(p.first_b) ? p.first_b : B_CYCLES[0] });
    }
    return out.sort((a, b) => a.start - b.start);
  }
  duty(dt) {
    let p = null;
    for (const x of this.periods) { if (x.start <= dt) p = x; else break; }
    if (!p) return { squad: "未知", bCycle: "" };
    const n = dayDiff(p.start, dt), L = p.order.length;
    const squad = p.order[((n % L) + L) % L];
    if (squad !== this.my) return { squad, bCycle: "" };
    const k = Math.floor((n - p.order.indexOf(this.my)) / L);
    const other = p.firstB === B_CYCLES[0] ? B_CYCLES[1] : B_CYCLES[0];
    return { squad, bCycle: k % 2 === 0 ? p.firstB : other };
  }
  squads() {
    const seen = [];
    for (const p of this.periods.slice().reverse()) for (const s of p.order) if (!seen.includes(s)) seen.push(s);
    return seen;
  }
  holidayName(dt) {
    const k = ymd(dt), md = `${dt.getMonth() + 1}-${dt.getDate()}`;
    if (this.extraOnce[k]) return this.extraOnce[k];
    if (this.extraAnnual[md]) return this.extraAnnual[md];
    return FIXED_HOLIDAYS[md] || DYNAMIC_HOLIDAYS[k] || "";
  }
}

const state = {

// ==========================================
// 🔐 連線
// ==========================================
class AuthError extends Error {}
class DbError extends Error {}
class NetError extends Error {}
const AUTH_TEXT = {
  INVALID_LOGIN_CREDENTIALS: "帳號或密碼錯誤", INVALID_PASSWORD: "帳號或密碼錯誤", EMAIL_NOT_FOUND: "帳號或密碼錯誤",
  INVALID_EMAIL: "帳號格式不正確", USER_DISABLED: "此帳號已被停用", TOO_MANY_ATTEMPTS_TRY_LATER: "嘗試次數過多，請稍後再試",
  TOKEN_EXPIRED: "登入已失效（可能有人變更了密碼），請用新密碼重新登入", INVALID_REFRESH_TOKEN: "登入已失效，請重新登入",
  USER_NOT_FOUND: "登入已失效，請重新登入", INVALID_ID_TOKEN: "登入已失效，請重新登入",
};
async function http(url, opts = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), HTTP_TIMEOUT);
  try { return await fetch(url, Object.assign({ cache: "no-store" }, opts, { signal: ctrl.signal })); }
  catch (e) { throw new NetError(e.name === "AbortError" ? "連線逾時，請檢查網路。" : "無法連線，請檢查網路。"); }
  finally { clearTimeout(timer); }
}
async function authErrorText(res) {
  try {
    const j = await res.json();
    const msg = (j.error && j.error.message) || "";
    const code = msg.split(" ")[0].split(":")[0].trim();
    return AUTH_TEXT[code] || `登入失敗（${msg || res.status}）`;
  } catch (e) { return `登入失敗（${res.status}）`; }
}
function setTokens(id, refresh, expiresIn) {
  state.idToken = id;
  state.tokenExpiry = Date.now() + (parseInt(expiresIn || "3600", 10) - 300) * 1000;
  if (refresh) { state.refreshToken = refresh; try { localStorage.setItem(LS.refresh, refresh); } catch (e) {} }
}
async function signIn(email, password) {
  const res = await http(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password, returnSecureToken: true }) });
  if (!res.ok) { if (res.status >= 500) throw new NetError(`伺服器錯誤（${res.status}）`); throw new AuthError(await authErrorText(res)); }
  const d = await res.json();
  setTokens(d.idToken, d.refreshToken, d.expiresIn);
}
async function refreshId() {
  if (!state.refreshToken) throw new AuthError("請先登入");
  const res = await http(`https://securetoken.googleapis.com/v1/token?key=${API_KEY}`, {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: `grant_type=refresh_token&refresh_token=${encodeURIComponent(state.refreshToken)}` });
  if ([400, 401, 403].includes(res.status)) throw new AuthError(await authErrorText(res));
  if (!res.ok) throw new NetError(`伺服器錯誤（${res.status}）`);
  const d = await res.json();
  setTokens(d.id_token, d.refresh_token, d.expires_in);
}
/** 所有資料庫請求都走這裡：token 過期自動續期、檢查回應。 */
async function fb(method, path = "", root = TASKS_URL, body) {
  if (!state.idToken || Date.now() >= state.tokenExpiry) await refreshId();
  for (const canRetry of [true, false]) {
    const opts = { method };
    if (body !== undefined) { opts.headers = { "Content-Type": "application/json" }; opts.body = JSON.stringify(body); }
    const res = await http(`${root}${path}.json?auth=${encodeURIComponent(state.idToken)}`, opts);
    if (res.status === 401 && canRetry) { await refreshId(); continue; }
    if (res.status === 401 || res.status === 403) {
      let detail = ""; try { detail = (await res.json()).error || ""; } catch (e) {}
      throw new DbError(`資料庫拒絕存取（${detail}）。請檢查 Firebase 的資料庫 Rules。`);
    }
    if (!res.ok) throw new NetError(`伺服器錯誤（${res.status}）`);
    const txt = await res.text();
    return txt ? JSON.parse(txt) : null;
  }
}

// ==========================================
// 📅 一天的判斷（規則＋手動調整）
// ==========================================
function task(d) {
  let t = state.tasks[d];
  if (typeof t === "string") t = { case: t };
  return t && typeof t === "object" ? t : {};
}
function leavesOf(t) {
  const lv = t && t.leaves, o = {};
  if (lv && typeof lv === "object") for (const [k, v] of Object.entries(lv)) o[k] = String(v || "");
  return o;
}
const effSquad = dt => norm(task(ymd(dt)).dutySquad) || state.rules.duty(dt).squad;
function autoOff(dt, squad) {
  const r = state.rules;
  if (squad === r.my) return [false, ""];
  const hol = r.holidayName(dt);
  if (hol && r.holidayOff) return [true, hol];
  const wd = dt.getDay();
  if ((wd === 0 || wd === 6) && r.weekendOff) return [true, "休假"];
  if (wd === 5 && r.compFri && effSquad(addDays(dt, 2)) === r.my) return [true, "補休"];
  if (wd === 1 && r.compMon && effSquad(addDays(dt, -2)) === r.my) return [true, "補休"];
  return [false, ""];
}
function dayInfo(dt, t) {
  const r = state.rules;
  if (!t) t = task(ymd(dt));
  const base = r.duty(dt);
  const sqOv = norm(t.dutySquad), bOv = norm(t.bCycle);
  const squad = sqOv || base.squad;
  let b = "";
  if (squad === r.my) b = bOv || (base.squad === r.my ? base.bCycle : "");
  const [aOff, aReason] = autoOff(dt, squad);
  let ov = t.overrideDuty || ""; ov = OV_ALIASES[ov] || ov;
  const custom = norm(t.customReason);
  const isOff = ov === "輪休" ? true : ov === "上班" ? false : aOff;
  const reason = isOff ? (custom || (aOff ? aReason : "") || "輪休") : "";
  const role = squad === r.my ? (isOff ? "duty_off" : "duty") : squad === r.reserve ? "reserve" : "other";
  return { squad, bCycle: b, isOff, reason, label: isOff ? "" : custom, holiday: r.holidayName(dt), task: t,
           role, manual: !!(ov || sqOv || bOv), leaves: leavesOf(t) };
}
function describe(info) {
  const my = state.rules.my;
  const duty = info.squad === my ? `${my}值班 ${info.bCycle}`.trim() : info.squad === "未知" ? "輪值未設定" : `${info.squad}值班`;
  let us = info.isOff ? `本隊休假（${info.reason}）` : info.squad === my ? "本隊值班" : info.role === "reserve" ? "本隊上班・預備" : "本隊上班";
  if (info.label) us += `・${info.label}`;
  if (info.role === "duty" && state.identity.name) { const s = shiftOf(info.bCycle, state.identity.team); if (s) us += `｜你：${s}`; }
  return `${duty}｜${us}`;
}
const LEAVE_SHORT = { "休假": "休", "補休": "補", "事假": "事", "病假": "病", "公假": "公", "公差": "差", "喪假": "喪", "婚假": "婚" };
/** 一天要顯示的標籤：[文字, 顏色變數]。手機直式時文字精簡，方便一格放下。 */
function cellEvents(info, wide) {
  const E = [];
  if (info.role === "duty") E.push([wide ? `值班 ${info.bCycle}`.trim() : (info.bCycle.replace("/", "") || "本隊值班"), "duty-fg"]);
  else if (info.role === "duty_off") E.push(["本隊值班日", "muted"]);
  else if (info.role === "reserve") E.push(["預備", "reserve-fg"]);
  if (info.holiday) E.push([info.holiday, "holiday-fg"]);

  else if (info.label) E.push([info.label, "manual-fg"]);
  const lv = Object.entries(info.leaves).sort((a, b) => a[0].localeCompare(b[0], "zh-Hant"));
  for (const [n, v] of lv) E.push([wide ? `${n} ${v || "請假"}` : `${n}${LEAVE_SHORT[v] || (v ? v[0] : "")}`, "leave-fg"]);

function ask(title, msg, buttons, extraHtml) {
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "modal-wrap";
    wrap.innerHTML = `<div class="modal" role="dialog"><h3>${esc(title)}</h3><div class="msg">${esc(msg)}</div>${extraHtml || ""}<div class="btns"></div></div>`;
    const box = wrap.querySelector(".btns");
    for (const [key, text, kind] of buttons) {
      const b = document.createElement("button");
      b.className = "btn" + (kind ? " " + kind : "");
      b.textContent = text;
      b.onclick = () => { wrap.remove(); resolve(key); };
      box.appendChild(b);

    document.body.appendChild(wrap);
  });
}

/** 只送出有改的欄位；同事剛好也改了同一欄時先詢問。 */
async function saveDay() {
  if (!state.online) { alertBox("離線模式", "目前離線，無法儲存。網路恢復後會自動重連，也可以按「🔄 同步」。"); return false; }
  const d = state.selected, vals = readFields(), orig = state.snapshot || {};
  const changed = {};
  for (const k of FORM_KEYS) if (vals[k] !== (orig[k] || "")) changed[k] = vals[k];
  if (!Object.keys(changed).length) { toast("沒有需要儲存的修改"); return true; }
  state.busy++;
  let server = {};
  try {
    server = (await fb("GET", `/${d}`)) || {};
    if (typeof server !== "object") server = {};
    const conflicts = Object.keys(changed).filter(k => { const s = norm(server[k]); return s !== (orig[k] || "") && s !== vals[k]; });
    if (conflicts.length) {
      const who = norm(server.updatedBy) || "同事", when = norm(server.updatedAt);
      const ans = await ask("同事剛改過這天",
        `${who}${when ? "（" + when + "）" : ""} 也修改了 ${d} 的「${conflicts.map(k => FIELD_NAMES[k]).join("、")}」。`,
        [["cancel", "先不要存", ""], ["theirs", "改看最新內容", ""], ["mine", "用我的覆蓋", "primary"]]);
      if (ans === "cancel") return false;
      if (ans === "theirs") { state.tasks[d] = server; loadFields(d); renderCalendar(); return false; }
    }
    const meta = { updatedBy: state.identity.name || "未具名", updatedAt: nowStr() };
    const body = {};
    for (const [k, v] of Object.entries(changed)) body[`${d}/${k}`] = v || null;
    for (const [k, v] of Object.entries(meta)) body[`${d}/${k}`] = v;
    await fb("PATCH", "", TASKS_URL, body);
    state.tasks[d] = server;
    applyLocal(d, Object.assign({}, changed, meta));
  } catch (e) { handleError(e, "儲存失敗"); return false; }
  finally { state.busy--; }
  saveCache();
  loadFields(d);
  renderCalendar();
  toast(`✔ ${fmtMD(parseYmd(d))} 已儲存`);
  setStatus(`✔ 已儲存（${hhmm()}）`);
  return true;
}
function applyLocal(d, changes) {
  const t = clone(task(d));
  for (const [key, v] of Object.entries(changes)) {
    const parts = key.split("/");
    let node = t;
    for (const p of parts.slice(0, -1)) { if (!node[p] || typeof node[p] !== "object") node[p] = {}; node = node[p]; }
    if (v === null || v === "") delete node[parts[parts.length - 1]]; else node[parts[parts.length - 1]] = v;
  }
  if (t.leaves && !Object.keys(t.leaves).length) delete t.leaves;
  const hasContent = Object.entries(t).some(([k, v]) => !META_KEYS.includes(k) && ((typeof v === "string" && v.trim()) || (v && typeof v === "object" && Object.keys(v).length)));
  if (hasContent) state.tasks[d] = t; else delete state.tasks[d];
}
/** 一次修改多天的部分欄位（null＝清除），不會蓋掉同事的其他資料。 */
async function applyPatch(dates, changes, doneMsg) {
  if (!dates.length) return false;
  if (!state.online) { alertBox("離線模式", "目前離線，無法修改。"); return false; }
  const touchesForm = Object.keys(changes).some(k => FORM_KEYS.includes(k.split("/")[0]));
  if (touchesForm && state.openSheet === "day" && dates.includes(state.selected) && !(await confirmDiscard())) return false;
  const meta = { updatedBy: state.identity.name || "未具名", updatedAt: nowStr() }, body = {};
  for (const d of dates) {
    for (const [k, v] of Object.entries(changes)) body[`${d}/${k}`] = v === "" ? null : v;
    for (const [k, v] of Object.entries(meta)) body[`${d}/${k}`] = v;
  }
  state.busy++;
  try { await fb("PATCH", "", TASKS_URL, body); }
  catch (e) { handleError(e, "修改失敗"); return false; }
  finally { state.busy--; }
  for (const d of dates) applyLocal(d, Object.assign({}, changes, meta));
  saveCache();
  if (state.openSheet === "day" && dates.includes(state.selected)) { if (touchesForm) loadFields(state.selected); else refreshDaySheet(true); }
  renderCalendar();
  if (state.openSheet === "batch") refreshBatchSheet();
  toast(`✔ ${doneMsg}` + (dates.length > 1 ? `（${dates.length} 天）` : ""));
  setStatus(`✔ ${doneMsg}（${hhmm()}）`);
  return true;
}
async function addLeave(dates, name, type) {
  name = (name || "").trim(); type = (type || "").trim() || "請假";
  if (!name) { alertBox("請輸入姓名", "請先輸入或選擇請假人員的名字。"); return false; }
  if (BAD_KEY.test(name)) { alertBox("名字格式", "名字裡不能有 . $ # [ ] / 這些符號。"); return false; }
  return applyPatch(dates, { [`leaves/${name}`]: type }, `已登記 ${name} ${type}`);
}
async function removeLeave(dates, name) {
  name = (name || "").trim();
  if (!name) { alertBox("請輸入姓名", "請先輸入或選擇要移除的人員。"); return false; }
  const where = dates.length > 1 ? `${dates.length} 天` : fmtMD(parseYmd(dates[0]));
  if (!(await confirmBox("移除請假", `移除 ${name} 在 ${where} 的請假登記？`, "移除", true))) return false;
  return applyPatch(dates, { [`leaves/${name}`]: null }, `已移除 ${name} 的請假`);
}

function onBatchChip(reason, st) { segSet($("#b-status"), st); $("#b-reason").value = reason; }
async function applyBatch() {
  const changes = {}, st = segGet($("#b-status")), reason = $("#b-reason").value.trim();
  if (st && st !== "不變更") {
    changes.overrideDuty = STATUS_TO_OV[st] || null;

  if (!Object.keys(changes).length) { alertBox("沒有變更", "請先選擇要調整的狀態、說明或值班隊。"); return; }
  if (await applyPatch(Array.from(state.multi).sort(), changes, "已套用")) {
    segSet($("#b-status"), "不變更"); $("#b-reason").value = ""; $("#b-duty").value = "__keep";
  }

function saveCache() { lsSet(LS.tasks, state.tasks); }
async function syncSettings() {
  try {
    const cloud = await fb("GET", "", SETTINGS_URL);
    state.settingsOk = true;
    if (cloud && cloud.rules && typeof cloud.rules === "object") {
      state.settingsMeta = { updatedBy: cloud.updatedBy || "", updatedAt: cloud.updatedAt || "" };
      const r = new Rules(cloud.rules);
      if (JSON.stringify(r.data) !== JSON.stringify(state.rules.data)) { state.rules = r; lsSet(LS.rules, r.data); return true; }
    }
  } catch (e) {
    if (e instanceof DbError) state.settingsOk = false;
    else if (e instanceof AuthError) throw e;
  }
  return false;
}
async function loadAll(manual) {
  if (manual && !(await confirmDiscard())) return;
  if (manual) setStatus("同步中…");
  state.busy++;
  try {
    const data = await fb("GET");
    state.tasks = data && typeof data === "object" ? data : {};
    saveCache();
    state.online = true;
    await syncSettings();
  } catch (e) {
    state.busy--;
    if (e instanceof AuthError) { authLost(e.message); return; }
    goOffline(e.message, true);
    return;
  }
  state.busy--;
  applyOnlineState();
  setBanner(state.settingsOk ? "" : "⚠ 雲端規則無法讀取（Firebase Rules 需要開放 dutySettings），目前用內建規則。");
  if (state.openSheet === "day" && !isDirty()) loadFields(state.selected);
  renderAll();
  setStatus(`✔ 已同步（${hhmm()}）`);
  afterMainReady();
}
async function refreshFromCloud() {
  if (state.busy || !state.mainVisible || !state.refreshToken) return;
  const wasOnline = state.online;
  state.busy++;
  let data;
  try { data = await fb("GET"); }
  catch (e) {
    state.busy--;
    if (e instanceof AuthError) { authLost(e.message); return; }
    if (wasOnline) setStatus(`⚠ 自動更新失敗（${hhmm()}），稍後再試`);
    return;
  }
  data = data && typeof data === "object" ? data : {};
  state.pollCount++;
  let rulesChanged = false;
  if (!wasOnline || state.pollCount % SETTINGS_POLL_EVERY === 0) { try { rulesChanged = await syncSettings(); } catch (e) {} }
  state.busy--;
  const changed = JSON.stringify(data) !== JSON.stringify(state.tasks);
  if (!wasOnline) { state.online = true; applyOnlineState(); }
  if (changed || !wasOnline || rulesChanged) {
    state.tasks = data; saveCache();
    if (state.openSheet === "day") { if (!isDirty()) loadFields(state.selected); else refreshDaySheet(true); }
    renderAll();
  }
  if (!wasOnline) setStatus(`✔ 已重新連線（${hhmm()}）`);
  else if (rulesChanged) setStatus(`↻ ${state.settingsMeta.updatedBy || "同事"}更新了規則（${hhmm()}）`);
  else if (changed) setStatus(`↻ 已更新同事的修改（${hhmm()}）`);
}
function goOffline(reason, alertUser) {
  state.online = false;
  applyOnlineState();
  renderAll();
  const note = Object.keys(state.tasks).length ? "顯示這支手機上次載入的資料" : "沒有快取資料，只顯示輪值與假日";
  setStatus(`⚠ 離線（唯讀）：${note}` + (state.refreshToken ? "；網路恢復後會自動重連" : ""));
  if (alertUser) alertBox("離線模式", `${reason}\n\n目前為唯讀模式，${note}。`);
  afterMainReady();
}
function authLost(msg) {
  try { localStorage.removeItem(LS.refresh); } catch (e) {}
  state.refreshToken = ""; state.idToken = ""; state.tokenExpiry = 0; state.online = false;
  showLogin(msg);
}

async function applyIdentity(name, team, remember, remind, hour) {
  team = normalizeTeam(team);
  const changedPerson = name !== state.identity.name;
  state.identity = Object.assign({}, state.identity, { name, team, remember, remind, remindHour: hour });
  if (changedPerson) delete state.identity.lastReminded;
  if (remember) saveIdentity();
  else lsSet(LS.identity, { remember: false, remind, remindHour: hour });
  await ensureInRoster(name, team);
  renderAll();
  setStatus(`👤 目前身分：${name}（${teamLabel(team)}）`);
  maybeRemind();
}
/** 把自己的姓名與小隊寫進全隊名冊（只改名冊這一欄，不動其他規則）。 */
async function ensureInRoster(name, team) {
  const same = () => state.rules.memberTeam.has(name) && state.rules.memberTeam.get(name) === team;
  if (same() || !state.online) return;
  try {
    await syncSettings();
    if (same()) return;
    const roster = state.rules.roster.slice(), i = roster.findIndex(r => r[0] === name);
    if (i >= 0) roster[i] = [name, team]; else roster.push([name, team]);
    const text = formatMembers(roster);
    await fb("PATCH", "", SETTINGS_URL, { "rules/members": text, updatedBy: name, updatedAt: nowStr() });
    const data = clone(state.rules.data); data.members = text;
    state.rules = new Rules(data); lsSet(LS.rules, data);
  } catch (e) {
    if (e instanceof AuthError) authLost(e.message);
    else toast("名冊沒能寫到雲端：" + e.message);
  }
}
function reminderContent(dt, name, team) {
  name = name === undefined ? state.identity.name : name;
  team = team === undefined ? state.identity.team : normalizeTeam(team);
  const info = dayInfo(dt);
  if (info.role !== "duty") return null;
  const b = info.bCycle, shift = shiftOf(b, team), m = /^(B\d)日\/(B\d)夜$/.exec(b || "");
  const main = shift ? `你是 ${team} 小隊：${shift}` : m ? `${m[1]} 日班、${m[2]} 夜班` : "班別未定，請確認";
  const leave = name ? leavesOf(info.task)[name] : "";
  return { main, b, shift, label: info.label, note: leave ? `你已登記這天「${leave}」，記得確認代班。` : "" };
}
function nextDutyDay(from) {
  let d = addDays(from || new Date(), 1);
  for (let i = 0; i < 60; i++, d = addDays(d, 1)) if (dayInfo(d).role === "duty") return d;
  return null;
}
function maybeRemind(now) {
  const id = state.identity;
  if (!state.mainVisible || !id.name || id.remind === false) return false;
  now = now || new Date();
  if (now.getHours() < (id.remindHour || 21)) return false;
  const tomorrow = addDays(now, 1), key = `${id.name}|${ymd(tomorrow)}`;
  if (id.lastReminded === key) return false;
  const c = reminderContent(tomorrow);
  if (!c) return false;
  id.lastReminded = key;
  lsSet(LS.identity, id.remember === false ? { remember: false, remind: id.remind, remindHour: id.remindHour, lastReminded: key } : id);
  showReminder(tomorrow, c, false, now);
  return true;
}
function showReminder(dt, c, preview, now) {
  const today = now || new Date();
  const when = ymd(dt) === ymd(addDays(today, 1)) ? "明天 " : "";
  const html = `<div style="font-size:19px;font-weight:800;margin-top:6px">${when}${fmtMD(dt)} ${esc(state.rules.my)}值班</div>
    <div class="remind-box"><div class="big">${esc(c.main)}</div>${c.b ? `<div style="font-size:13px;margin-top:2px">班別：${esc(c.b)}</div>` : ""}</div>
    ${c.label ? `<div style="margin-top:8px;font-size:14px">備註：${esc(c.label)}</div>` : ""}
    ${c.note ? `<div style="margin-top:8px;font-size:14px;color:var(--off-fg)">${esc(c.note)}</div>` : ""}`;
  if (!preview && navigator.vibrate) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} }
  ask("⏰ 值班提醒" + (preview ? "（預覽）" : ""), "", [["view", "查看那天", ""], ["ok", "知道了", "primary"]], html)
    .then(k => { if (k === "view" && !preview) openDay(ymd(dt)); });
}
/** 匯出 .ics：手機行事曆會在值班前一天的提醒時間通知，不用開著網頁。 */
function exportIcs() {
  const id = state.identity;
  if (!id.name) { openIdentity(true); return; }
  const hour = id.remindHour || 21, hash = Array.from(id.name).reduce((h, c) => ((h * 31) + c.charCodeAt(0)) >>> 0, 7).toString(16);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//DutyCalendar//ZH-TW", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
             `X-WR-CALNAME:${state.rules.my}值班`];
  let n = 0;
  for (let i = 1; i <= 120; i++) {
    const d = addDays(new Date(), i), info = dayInfo(d);
    if (info.role !== "duty") continue;
    const shift = shiftOf(info.bCycle, id.team);
    const summary = `${state.rules.my}值班` + (shift ? `（${shift}）` : info.bCycle ? `（${info.bCycle}）` : "");
    const ds = ymd(d).replace(/-/g, ""), de = ymd(addDays(d, 1)).replace(/-/g, "");
    L.push("BEGIN:VEVENT", `UID:duty-${ds}-${hash}@duty-calendar`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ds}`,
           `DTEND;VALUE=DATE:${de}`, `SUMMARY:${summary}`, `DESCRIPTION:班別：${info.bCycle || "未定"}`,
           "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:明天${summary}`, `TRIGGER:-PT${24 - hour}H`, "END:VALARM", "END:VEVENT");
    n++;
  }
  L.push("END:VCALENDAR");
  if (!n) { alertBox("沒有值班日", "接下來 120 天沒有本隊值班日。"); return; }
  const blob = new Blob([L.join("\r\n") + "\r\n"], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `${state.rules.my}值班提醒.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast(`已匯出 ${n} 個值班日（前一天 ${hour}:00 提醒）`);
}

function showLogin(msg) {
  state.mainVisible = false;
  $("#loading").classList.add("hidden"); $("#main").classList.add("hidden"); $("#login").classList.remove("hidden");
  openSheet(null);
  $("#login-err").textContent = msg || "";
  $("#acc").value = localStorage.getItem(LS.account) || "";
  $("#offline-btn").classList.toggle("hidden", !Object.keys(state.tasks).length);
  renderLegend();
  (($("#acc").value) ? $("#pwd") : $("#acc")).focus();
}
function enterMain() {
  state.mainVisible = true;
  $("#loading").classList.add("hidden"); $("#login").classList.add("hidden"); $("#main").classList.remove("hidden");
  renderAll(); applyOnlineState();
}
let readyDone = false;
function afterMainReady() {
  if (readyDone) return;
  readyDone = true;
  if (!state.identity.name) setTimeout(() => openIdentity(true), 200);
  else setStatus($("#status").textContent + `　👤 已自動辨識：${state.identity.name}（${teamLabel(state.identity.team)}）`);
  setTimeout(maybeRemind, 1500);
  setInterval(maybeRemind, REMIND_CHECK_MS);
  setInterval(() => { if (!document.hidden) refreshFromCloud(); }, POLL_MS);
}
async function doLogin() {
  let acc = $("#acc").value.trim(); const pwd = $("#pwd").value;
  if (!acc || !pwd) { $("#login-err").textContent = "請輸入帳號與密碼"; return; }
  const email = acc.includes("@") ? acc : acc + EMAIL_DOMAIN;
  const btn = $("#login-btn"); btn.disabled = true; btn.textContent = "登入中…";
  try { await signIn(email, pwd); }
  catch (e) { $("#login-err").textContent = e.message; btn.disabled = false; btn.textContent = "登入"; return; }
  btn.disabled = false; btn.textContent = "登入";
  try { localStorage.setItem(LS.account, acc); } catch (e) {}
  $("#pwd").value = "";
  enterMain();
  await loadAll(false);
}
async function startup() {
  buildStaticControls();
  renderLegend();
  if (!state.refreshToken) { showLogin(); return; }
  try { await refreshId(); }
  catch (e) {
    if (e instanceof AuthError) { authLost(e.message); return; }
    enterMain(); goOffline(e.message, true); return;
  }
  enterMain();
  await loadAll(false);
}

function changeMonth(n) { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + n, 1); renderCalendar(); }
function onCellTap(d) {
  if (state.multiMode) {
    if (state.multi.has(d)) state.multi.delete(d); else state.multi.add(d);
    renderCalendar(); renderMultibar();
    if (state.openSheet === "batch") refreshBatchSheet();
    return;
  }
  openDay(d);
}
function setupEvents() {
  $("#login-btn").onclick = doLogin;
  $("#pwd").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  $("#acc").addEventListener("keydown", e => { if (e.key === "Enter") $("#pwd").focus(); });
  $("#offline-btn").onclick = () => { enterMain(); goOffline("尚未登入", false); };
  $("#prev").onclick = () => changeMonth(-1);
  $("#next").onclick = () => changeMonth(1);
  $("#today").onclick = () => { const t = new Date(); state.month = new Date(t.getFullYear(), t.getMonth(), 1); if (!state.openSheet) state.selected = ymd(t); renderCalendar(); };
  $("#sync").onclick = () => loadAll(true);
  $("#multi-btn").onclick = () => setMultiMode(!state.multiMode);
  $("#me-btn").onclick = () => openIdentity(false);
  $("#settings-btn").onclick = () => {
    $("#theme-sel").value = document.documentElement.getAttribute("data-theme");
    $("#show-others").checked = !!state.showOthers;
    const meta = state.settingsMeta.updatedAt ? `（最後更新：${state.settingsMeta.updatedBy || "未具名"}・${state.settingsMeta.updatedAt}）` : "";
    $("#s-rules").textContent = `輪值順序、本隊／預備隊、成員名冊、自訂假日都存在雲端，和電腦版共用；請在電腦版的「⚙ 規則」修改。${meta}`;
    openSheet("settings");
  };
  $("#backdrop").onclick = () => closeSheet();
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => closeSheet());
  $("#theme-sel").onchange = e => { document.documentElement.setAttribute("data-theme", e.target.value); try { localStorage.setItem(LS.theme, e.target.value); } catch (err) {} };
  $("#show-others").onchange = e => { state.showOthers = e.target.checked; lsSet(LS.others, state.showOthers); renderCalendar(); };
  $("#s-identity").onclick = () => openIdentity(false);
  $("#s-ics").onclick = exportIcs;
  $("#s-logout").onclick = async () => {
    if (!(await confirmBox("登出", "要登出這支手機，並清除手機上的快取資料嗎？（不影響其他同事）", "登出", true))) return;
    for (const k of [LS.refresh, LS.tasks]) { try { localStorage.removeItem(k); } catch (e) {} }
    state.tasks = {}; authLost("已登出");
  };

  // 單日編輯
  $("#d-status").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || !state.online) return;
    segSet($("#d-status"), b.dataset.v);
    if (SQUAD_CHIPS.some(([r]) => r === $("#d-reason").value.trim())) $("#d-reason").value = "";
    refreshDaySheet(false);
  });
  for (const id of ["#d-reason", "#d-case", "#d-note"]) $(id).addEventListener("input", () => refreshDaySheet(false));
  for (const id of ["#d-duty", "#d-b"]) $(id).addEventListener("change", () => refreshDaySheet(false));
  $("#d-save").onclick = () => saveDay();
  $("#d-reset").onclick = resetFields;
  $("#d-leave-add").onclick = async () => {
    if (await addLeave([state.selected], $("#d-leave-name").value, $("#d-leave-type").value)) $("#d-leave-name").value = "";
  };

  // 多選
  $("#b-status").addEventListener("click", e => { const b = e.target.closest("button"); if (b && state.online) segSet($("#b-status"), b.dataset.v); });
  $("#b-apply").onclick = applyBatch;
  $("#b-reset").onclick = resetBatch;
  $("#b-leave-add").onclick = async () => {
    if (await addLeave(Array.from(state.multi).sort(), $("#b-leave-name").value, $("#b-leave-type").value)) $("#b-leave-name").value = "";
  };
  $("#b-leave-del").onclick = () => removeLeave(Array.from(state.multi).sort(), $("#b-leave-name").value);

  // 月曆：點選、長按進入多選、左右滑動換月
  const cal = $("#cal");
  let pressTimer = null, longPressed = false, sx = 0, sy = 0;
  cal.addEventListener("click", e => {
    const c = e.target.closest(".cell"); if (!c) return;
    if (longPressed) { longPressed = false; return; }
    onCellTap(c.dataset.d);
  });
  cal.addEventListener("contextmenu", e => {
    const c = e.target.closest(".cell"); if (!c) return;
    e.preventDefault();
    if (!state.multiMode) setMultiMode(true, c.dataset.d);
  });
  cal.addEventListener("touchstart", e => {
    const t = e.changedTouches[0]; sx = t.screenX; sy = t.screenY; longPressed = false;
    const c = e.target.closest(".cell");
    clearTimeout(pressTimer);
    if (c && !state.multiMode) pressTimer = setTimeout(() => { longPressed = true; setMultiMode(true, c.dataset.d); if (navigator.vibrate) navigator.vibrate(30); }, 550);
  }, { passive: true });
  cal.addEventListener("touchmove", e => {

  }, { passive: true });
  cal.addEventListener("touchend", e => {
    clearTimeout(pressTimer);
    const t = e.changedTouches[0], dx = t.screenX - sx, dy = t.screenY - sy;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) changeMonth(dx < 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener("visibilitychange", () => { if (!document.hidden && state.mainVisible) { refreshFromCloud(); maybeRemind(); } });
  window.addEventListener("online", () => refreshFromCloud());
  window.addEventListener("resize", () => { clearTimeout(setupEvents._r); setupEvents._r = setTimeout(renderCalendar, 150); });
  window.addEventListener("beforeunload", e => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });
}

setupEvents();
startup();
</script>
